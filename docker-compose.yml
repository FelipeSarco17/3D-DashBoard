name: 3D-Dashboard

services:
    frontend:
        container_name: 3D-Dashboard-Frontend
        build: 
            context: ./FrontEnd
            dockerfile: Dockerfile.dev
        ports:
            - "5173:5173"
        volumes:
            - ./FrontEnd:/app
            - /app/node_modules
        networks:
            - frontend
        command: >
            bash -c "cp -rfu /cache/node_modules/. /app/node_modules/  
            && npm run dev"
    
    backend:
        container_name: 3D-Dashboard-Backend
        build: 
            context: ./BackEnd
            dockerfile: Dockerfile.dev
        ports:
            - "3000:3000"
        volumes:
            - ./BackEnd:/app
            - /app/node_modules
        networks:
            - frontend
            - backend
        depends_on:
            database:
                condition: service_healthy
        command: >
            bash -c "cp -rfu /cache/node_modules/. /app/node_modules/  
            && npm run dev"


    database:
        container_name: 3D-Dashboard-Database
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            - POSTGRES_USER=3d-dashboard
            - POSTGRES_PASSWORD=3d-dashboard123
            - POSTGRES_DB=3d-dashboard-db
        ports:
            - "5432:5432"
        volumes:
            - 3D-Dashboard-Database-volume:/var/lib/3d-dashboard-db/data
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d 3D-Dashboard-DB"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    frontend:
    backend:

volumes:
    3D-Dashboard-Database-volume:

